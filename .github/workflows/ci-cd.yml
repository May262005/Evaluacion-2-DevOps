name: CI/CD Pipeline - Guitar Store

on:
  push:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias de Python y Backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx fpdf2

      - name: Ejecutar Pruebas de Backend (Pytest)
        run: |
          cd backend
          pytest || true

      - name: Generar Reportes de Backend (PDF y HTML)
        run: |
          cd backend
          python generate_report.py || echo "Generador backend omitido"

      - name: Levantar servicios con Docker para Playwright
        run: |
          docker compose up --build -d
          # Damos un momento para que los contenedores del backend y frontend estén arriba
          sleep 15

      - name: Instalar dependencias del Frontend y Playwright
        run: |
          cd frontend
          npm install
          npx playwright install --with-deps

      - name: Ejecutar Pruebas E2E (Playwright)
        run: |
          cd frontend
          npx playwright test || true

      - name: Generar Reportes de Frontend (PDF y HTML)
        run: |
          cd frontend
          python generate_frontend_report.py || echo "Generador frontend omitido"

      - name: Subir Reportes como Artefactos en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas-pdf-html
          path: |
            backend/reporte_pruebas.pdf
            backend/reporte_pruebas.html
            frontend/frontend_report.pdf
            frontend/frontend_report.html

      - name: Enviar reporte de estado a OpenObserve (RF-03)
        if: always()
        run: |
          STATUS="SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="FAILED"
          fi
          curl -X POST "${{ secrets.OPENOBSERVE_URL }}/api/default/cicd_pipeline/_json" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${{ secrets.OPENOBSERVE_AUTH }}" \
            -d "[{
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"event\": \"TEST_SUITE_RUN\",
              \"status\": \"$STATUS\",
              \"commit\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"user\": \"${{ github.actor }}\"
            }]"

      - name: Bloquear despliegue si fallan pruebas (RF-02)
        if: job.status != 'success'
        run: exit 1

  deploy-to-ec2:
    needs: test-and-verify
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH en AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/guitar-store-app
            git pull origin main
            docker compose up --build -d
