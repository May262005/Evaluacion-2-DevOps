services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guitar-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENOBSERVE_OTLP_ENDPOINT=http://openobserve:5080/api/default
      - OPENOBSERVE_AUTH_HEADER=Basic YWRtaW5AZ3VpdGFycy5jb206Q29tcGxleHBhc3MjMTIz

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend # <-- 1. Agrega esto para que Nginx lo encuentre
    # ports:                  # <-- 2. Quita o comenta los puertos del frontend
    #   - "80:80"             # porque nginx-proxy ya se encarga del puerto 80
    depends_on:
      - backend

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    restart: always
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=admin@guitars.com
      - ZO_ROOT_USER_PASSWORD=Complexpass#123
    volumes:
      - o2-data:/data

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Complexpass#123
    depends_on:
      - prometheus

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - openobserve
      - grafana

volumes:
  o2-data:
