services:
  - type: web
    name: guitar-backend
    env: docker
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: OPENOBSERVE_OTLP_ENDPOINT
        value: http://openobserve:5080/api/default
      - key: OPENOBSERVE_AUTH_HEADER
        value: Basic YWRtaW5AZ3VpdGFycy5jb206Q29tcGxleHBhc3MjMTIz

  - type: web
    name: guitar-frontend
    env: docker
    dockerfilePath: Dockerfile.frontend
    autoDeploy: true

  - type: web
    name: openobserve
    env: docker
    dockerfilePath: Dockerfile.openobserve
    autoDeploy: true
    envVars:
      - key: ZO_ROOT_USER_EMAIL
        value: admin@guitars.com
      - key: ZO_ROOT_USER_PASSWORD
        value: Complexpass#123

  - type: web
    name: prometheus
    env: docker
    dockerfilePath: Dockerfile.prometheus
    autoDeploy: true

  - type: web
    name: grafana
    env: docker
    dockerfilePath: Dockerfile.grafana
    autoDeploy: true
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: Complexpass#123