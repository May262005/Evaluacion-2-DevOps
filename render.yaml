services:
  # 1. Backend FastAPI
  - type: web
    name: guitar-backend
    env: docker
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: OPENOBSERVE_OTLP_ENDPOINT
        value: http://openobserve:5080/api/default
      - key: OPENOBSERVE_AUTH_HEADER
        value: Basic YWRtaW5AZ3VpdGFycy5jb206Q29tcGxleHBhc3MjMTIz

  # 2. Frontend React (Vite)
  - type: web
    name: guitar-frontend
    env: docker
    dockerfilePath: Dockerfile.frontend
    autoDeploy: true

  # 3. OpenObserve
  - type: web
    name: openobserve
    env: docker
    dockerImage: public.ecr.aws/zinclabs/openobserve:latest
    autoDeploy: true
    envVars:
      - key: ZO_ROOT_USER_EMAIL
        value: admin@guitars.com
      - key: ZO_ROOT_USER_PASSWORD
        value: Complexpass#123

  # 4. Prometheus
  - type: web
    name: prometheus
    env: docker
    dockerImage: prom/prometheus:latest
    autoDeploy: true

  # 5. Grafana
  - type: web
    name: grafana
    env: docker
    dockerImage: grafana/grafana:latest
    autoDeploy: true
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: Complexpass#123